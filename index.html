<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Healthspan Daily Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PWA & Native App Meta Tags -->

    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#1e1b4b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Healthspan">
    <link rel="icon" type="image/png" sizes="192x192" href="./assets/icons/icon-192.png">
    <link rel="apple-touch-icon" href="./assets/icons/icon-192.png">    
    <style>
        body { background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #312e81 100%); min-height: 100vh; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(12px); border-radius: 1rem; box-shadow: 0 10px 30px rgba(0,0,0,0.3); transition: all 0.3s ease; }
        .retort-banner { background: rgba(255, 255, 255, 0.1); border-left: 4px solid #64748b; backdrop-filter: blur(5px); }
        .loader { border: 4px solid rgba(255,255,255,0.2); border-top: 4px solid #fff; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        /* BOLD Checked States for Symptoms */
        .symptom-check + label { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
        #sym_sneezing:checked + label { background-color: #3b82f6; color: white; border-color: #2563eb; transform: scale(1.05); box-shadow: 0 4px 12px rgba(59,130,246,0.4); }
        #sym_runny:checked + label { background-color: #06b6d4; color: white; border-color: #0891b2; transform: scale(1.05); box-shadow: 0 4px 12px rgba(6,182,212,0.4); }
        #sym_eyes:checked + label { background-color: #ec4899; color: white; border-color: #db2777; transform: scale(1.05); box-shadow: 0 4px 12px rgba(236,72,153,0.4); }
        #sym_headache:checked + label { background-color: #ef4444; color: white; border-color: #dc2626; transform: scale(1.05); box-shadow: 0 4px 12px rgba(239,68,68,0.4); }
        #sym_weary:checked + label { background-color: #a855f7; color: white; border-color: #9333ea; transform: scale(1.05); box-shadow: 0 4px 12px rgba(168,85,247,0.4); }

        /* Interventions */
        .intervention-extras { display: none; }
        .intervention-check:checked ~ .intervention-extras { display: flex; }
    </style>
</head>
<body class="text-gray-800 p-4 md:p-8">

    <div class="max-w-3xl mx-auto">
        <header class="text-center mb-6">
            <h1 class="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-emerald-400 tracking-tight drop-shadow-lg">
                Healthspan Metrics
            </h1>
            <p class="text-indigo-200 mt-2 font-medium">Daily Logging Ecosystem <span class="bg-indigo-600 text-white text-xs px-2 py-1 rounded ml-2 align-middle">v1.6</span></p>
        </header>

        <div id="loadingState" class="flex flex-col items-center justify-center py-12">
            <div class="loader mb-4"></div>
            <p id="loadingText" class="text-white font-medium">Syncing ecosystem...</p>
        </div>

        <form id="healthspanForm" class="space-y-6 hidden">
            
            <!-- Global Date Header -->
            <div class="flex justify-end mb-2">
                <div class="glass-card p-3 border-4 border-yellow-400 bg-yellow-100 flex items-center space-x-3 shadow-lg">
                    <button type="button" onclick="changeDate(-1)" class="text-yellow-700 hover:text-yellow-900 font-bold p-2 text-xl">&larr;</button>
                    <div>
                        <label class="block text-xs font-bold text-yellow-800 uppercase tracking-wide text-center">Active Record Date</label>
                        <input type="date" id="record_date" required class="bg-yellow-200 text-yellow-900 text-2xl font-black p-2 rounded text-center border-none focus:ring-2 focus:ring-yellow-500 cursor-pointer">
                    </div>
                    <button type="button" onclick="changeDate(1)" class="text-yellow-700 hover:text-yellow-900 font-bold p-2 text-xl">&rarr;</button>
                </div>
            </div>
            
            <div id="fetchStatus" class="text-right text-indigo-200 text-sm font-medium h-5"></div>

            <!-- SECTION 1: Base Metrics -->
            <div id="section_metrics" class="glass-card p-6 border-t-4 border-indigo-500">
                <h2 class="text-xl font-bold text-indigo-800 mb-4 flex items-center"><span class="text-2xl mr-2">💤</span> Base Metrics</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Ambient Temp (°C)</label>
                        <input type="number" step="0.1" id="ambient_temp_celsius" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 bg-gray-50">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Sleep Debt Duration</label>
                        <div class="relative">
                            <!-- step="600" snaps to 10 min intervals -->
                            <input type="time" id="sleep_debt_manual" step="600" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 font-bold text-lg bg-gray-50 cursor-pointer">
                            <p class="text-xs text-indigo-600 mt-1 font-medium">↑ Tap clock icon to use the dial (10m intervals)</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- SECTION 2: HayFever -->
            <div id="section_hayfever" class="glass-card p-6 border-t-4 border-emerald-500">
                <h2 class="text-xl font-bold text-emerald-800 mb-4 flex items-center"><span class="text-2xl mr-2">🌿</span> HayFever Tracking</h2>
                
                <!-- Macro Environment First -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6 bg-emerald-50 p-4 rounded-lg border border-emerald-100">
                    <div>
                        <label class="block text-sm font-semibold text-emerald-800 mb-1">Postcode Prefix</label>
                        <input type="text" id="postcode_prefix" placeholder="e.g. SK9" class="w-full p-2 border border-emerald-200 rounded focus:ring-2 focus:ring-emerald-500">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-emerald-800 mb-1">Pollen Level</label>
                        <select id="pollen_count_level" class="w-full p-2 border border-emerald-200 rounded focus:ring-2 focus:ring-emerald-500">
                            <option value="">Select Level...</option>
                            <option value="Low">Low</option><option value="Moderate">Moderate</option><option value="High">High</option><option value="Very High">Very High</option>
                        </select>
                    </div>
                </div>
                
                <!-- Symptoms -->
                <div class="mb-6">
                    <label class="block text-sm font-bold text-gray-700 mb-3">Symptoms Present Today:</label>
                    <div class="flex flex-wrap gap-3">
                        <div class="relative"><input type="checkbox" id="sym_sneezing" value="Sneezing" class="symptom-check hidden"><label for="sym_sneezing" class="cursor-pointer px-4 py-2 rounded-full border-2 border-blue-300 bg-blue-50 text-blue-800 font-bold transition-all text-sm block">🤧 Sneezing</label></div>
                        <div class="relative"><input type="checkbox" id="sym_runny" value="Runny Nose" class="symptom-check hidden"><label for="sym_runny" class="cursor-pointer px-4 py-2 rounded-full border-2 border-cyan-300 bg-cyan-50 text-cyan-800 font-bold transition-all text-sm block">💧 Runny Nose</label></div>
                        <div class="relative"><input type="checkbox" id="sym_eyes" value="Itchy Eyes" class="symptom-check hidden"><label for="sym_eyes" class="cursor-pointer px-4 py-2 rounded-full border-2 border-pink-300 bg-pink-50 text-pink-800 font-bold transition-all text-sm block">👁️ Itchy Eyes</label></div>
                        <div class="relative"><input type="checkbox" id="sym_headache" value="Headache" class="symptom-check hidden"><label for="sym_headache" class="cursor-pointer px-4 py-2 rounded-full border-2 border-red-300 bg-red-50 text-red-800 font-bold transition-all text-sm block">🤕 Headache</label></div>
                        <div class="relative"><input type="checkbox" id="sym_weary" value="Weariness" class="symptom-check hidden"><label for="sym_weary" class="cursor-pointer px-4 py-2 rounded-full border-2 border-purple-300 bg-purple-50 text-purple-800 font-bold transition-all text-sm block">🥱 Weariness</label></div>
                    </div>
                </div>

                <div class="mb-6">
                    <label class="block text-sm font-bold text-gray-700 mb-1">Duration of Symptoms</label>
                    <input type="text" id="hayfever_duration_raw" placeholder="e.g., 5h or 90m" class="w-full md:w-1/2 p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 font-bold bg-gray-50">
                </div>

                <!-- Interventions -->
                <div class="border-t border-gray-200 pt-4">
                    <label class="block text-sm font-bold text-gray-700 mb-3">Interventions & Products Used (1=Poor, 5=Great):</label>
                    <div class="space-y-4">
                        <!-- Repeated for each intervention -->
                        <div class="flex flex-col md:flex-row md:items-center p-3 bg-gray-50 rounded-lg border border-gray-200">
                            <div class="flex items-center space-x-4 w-40 mb-2 md:mb-0">
                                <input type="checkbox" id="int_eyedrops" value="Eyedrops" class="intervention-check w-5 h-5 text-emerald-600 rounded">
                                <label class="font-bold text-gray-700">Eyedrops</label>
                            </div>
                            <div class="intervention-extras flex-col md:flex-row md:items-center flex-1 space-y-2 md:space-y-0 md:space-x-4">
                                <input type="text" id="prod_eyedrops" placeholder="Product (e.g. Hycosan)" class="p-2 border border-gray-300 rounded text-sm flex-1">
                                <div class="flex items-center space-x-2 bg-white px-3 py-1 rounded shadow-sm border border-gray-200">
                                    <span class="text-xs font-bold text-gray-400">Rate:</span>
                                    <input type="range" id="rate_eyedrops" min="1" max="5" value="3" class="w-24"><span class="font-black text-emerald-600 w-4 inline-block text-center">3</span>
                                </div>
                            </div>
                        </div>

                        <div class="flex flex-col md:flex-row md:items-center p-3 bg-gray-50 rounded-lg border border-gray-200">
                            <div class="flex items-center space-x-4 w-40 mb-2 md:mb-0">
                                <input type="checkbox" id="int_sunglasses" value="Sunglasses" class="intervention-check w-5 h-5 text-emerald-600 rounded">
                                <label class="font-bold text-gray-700">Sunglasses</label>
                            </div>
                            <div class="intervention-extras flex-col md:flex-row md:items-center flex-1 space-y-2 md:space-y-0 md:space-x-4">
                                <input type="text" id="prod_sunglasses" placeholder="Brand/Style (optional)" class="p-2 border border-gray-300 rounded text-sm flex-1">
                                <div class="flex items-center space-x-2 bg-white px-3 py-1 rounded shadow-sm border border-gray-200">
                                    <span class="text-xs font-bold text-gray-400">Rate:</span>
                                    <input type="range" id="rate_sunglasses" min="1" max="5" value="3" class="w-24"><span class="font-black text-emerald-600 w-4 inline-block text-center">3</span>
                                </div>
                            </div>
                        </div>

                        <div class="flex flex-col md:flex-row md:items-center p-3 bg-gray-50 rounded-lg border border-gray-200">
                            <div class="flex items-center space-x-4 w-40 mb-2 md:mb-0">
                                <input type="checkbox" id="int_spray" value="Nasal Spray" class="intervention-check w-5 h-5 text-emerald-600 rounded">
                                <label class="font-bold text-gray-700">Spray</label>
                            </div>
                            <div class="intervention-extras flex-col md:flex-row md:items-center flex-1 space-y-2 md:space-y-0 md:space-x-4">
                                <input type="text" id="prod_spray" placeholder="Product name..." class="p-2 border border-gray-300 rounded text-sm flex-1">
                                <div class="flex items-center space-x-2 bg-white px-3 py-1 rounded shadow-sm border border-gray-200">
                                    <span class="text-xs font-bold text-gray-400">Rate:</span>
                                    <input type="range" id="rate_spray" min="1" max="5" value="3" class="w-24"><span class="font-black text-emerald-600 w-4 inline-block text-center">3</span>
                                </div>
                            </div>
                        </div>

                        <div class="flex flex-col md:flex-row md:items-center p-3 bg-gray-50 rounded-lg border border-gray-200">
                            <div class="flex items-center space-x-4 w-40 mb-2 md:mb-0">
                                <input type="checkbox" id="int_tablets" value="Tablets" class="intervention-check w-5 h-5 text-emerald-600 rounded">
                                <label class="font-bold text-gray-700">Tablets</label>
                            </div>
                            <div class="intervention-extras flex-col md:flex-row md:items-center flex-1 space-y-2 md:space-y-0 md:space-x-4">
                                <input type="text" id="prod_tablets" placeholder="Product name..." class="p-2 border border-gray-300 rounded text-sm flex-1">
                                <div class="flex items-center space-x-2 bg-white px-3 py-1 rounded shadow-sm border border-gray-200">
                                    <span class="text-xs font-bold text-gray-400">Rate:</span>
                                    <input type="range" id="rate_tablets" min="1" max="5" value="3" class="w-24"><span class="font-black text-emerald-600 w-4 inline-block text-center">3</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- SECTION 3: GeneralSymptoms -->
            <div id="section_symptoms" class="glass-card p-6 border-t-4 border-rose-500">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-bold text-rose-800 flex items-center"><span class="text-2xl mr-2">❤️‍🩹</span> General Symptoms</h2>
                    <button type="button" onclick="addSymptomRow()" class="bg-rose-100 text-rose-700 hover:bg-rose-200 font-bold py-2 px-4 rounded-lg text-sm border border-rose-300 transition-colors">+ Add Symptom</button>
                </div>
                
                <div id="symptomsContainer" class="space-y-4">
                    <!-- Dynamic Rows Injected Here -->
                </div>
            </div>

            <button type="submit" id="submitBtn" class="w-full bg-gradient-to-r from-yellow-500 to-orange-500 text-white font-black text-xl p-4 rounded-xl shadow-lg hover:from-yellow-600 hover:to-orange-600 transition-all transform hover:scale-[1.01] border-2 border-orange-600">
                UPDATE DATABASE FOR SELECTED DATE
            </button>
            <div id="statusMessage" class="text-center font-bold mt-4 hidden"></div>
        </form>
    </div>

    <!-- Template for Symptom Row -->
    <template id="symptomRowTemplate">
        <div class="symptom-row bg-rose-50/50 p-4 rounded-lg border border-rose-100 relative">
            <button type="button" onclick="this.closest('.symptom-row').remove()" class="absolute top-2 right-2 text-gray-400 hover:text-red-500 text-xl font-bold">&times;</button>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-3 pr-6">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Symptom</label>
                    <input type="text" class="sym-desc w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-rose-500" placeholder="e.g. Migraine">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Suspected Cause</label>
                    <input type="text" class="sym-cause w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-rose-500" placeholder="e.g. Alcohol">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Duration (Hours)</label>
                    <input type="number" step="0.1" class="sym-dur w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-rose-500" placeholder="e.g. 4.5">
                </div>
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">Detailed Comment / Notes</label>
                <textarea class="sym-comment w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-rose-500" rows="2" placeholder="Add additional context..."></textarea>
            </div>
        </div>
    </template>

    <script>
        // REPLACE THIS URL WITH YOUR GOOGLE APPS SCRIPT WEB APP URL
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwNwr_7iZJuOVdT9u1xHNy9sYEKHjFyJtZ6Q-pDui-Y4qTpLQdi4NT2NiUcoBxwUFDgmA/exec';

        // UI Logic for Sliders
        document.querySelectorAll('input[type=range]').forEach(slider => {
            slider.addEventListener('input', (e) => e.target.nextElementSibling.innerText = e.target.value);
        });

        function parseDuration(val) {
            val = val.trim().toLowerCase();
            if (!val) return "";
            if (val.includes('h')) return parseFloat(val) * 60;
            if (val.includes('m')) return parseInt(val);
            return parseInt(val); 
        }

        function changeDate(daysOffset) {
            let dateInput = document.getElementById('record_date');
            let currentDate = new Date(dateInput.value);
            currentDate.setDate(currentDate.getDate() + daysOffset);
            dateInput.valueAsDate = currentDate;
            fetchDataForDate(dateInput.value);
        }

        document.getElementById('record_date').addEventListener('change', (e) => fetchDataForDate(e.target.value));

        // Dynamic Symptom Rows
        function addSymptomRow(desc = '', cause = '', dur = '', comment = '') {
            const container = document.getElementById('symptomsContainer');
            const template = document.getElementById('symptomRowTemplate');
            const clone = template.content.cloneNode(true);
            
            clone.querySelector('.sym-desc').value = desc;
            clone.querySelector('.sym-cause').value = cause;
            clone.querySelector('.sym-dur').value = dur;
            clone.querySelector('.sym-comment').value = comment;
            
            container.appendChild(clone);
        }

        function fetchDataForDate(dateStr) {
            const fetchStatus = document.getElementById('fetchStatus');
            fetchStatus.innerText = "Loading data...";
            
            // Clear Form
            document.getElementById('ambient_temp_celsius').value = '';
            document.getElementById('sleep_debt_manual').value = '';
            document.querySelectorAll('.symptom-check').forEach(cb => cb.checked = false);
            document.querySelectorAll('.intervention-check').forEach(cb => cb.checked = false);
            document.querySelectorAll('input[id^="prod_"]').forEach(inp => inp.value = '');
            document.getElementById('hayfever_duration_raw').value = '';
            document.getElementById('postcode_prefix').value = '';
            document.getElementById('pollen_count_level').value = '';
            document.getElementById('symptomsContainer').innerHTML = ''; // Clear dynamic rows

            fetch(`${GOOGLE_SCRIPT_URL}?date=${dateStr}`)
                .then(res => res.json())
                .then(data => {
                    fetchStatus.innerText = "Data loaded."; setTimeout(() => fetchStatus.innerText = "", 2000);
                    
                    if(data.data.metrics) {
                        document.getElementById('ambient_temp_celsius').value = data.data.metrics[6] || '';
                        document.getElementById('sleep_debt_manual').value = data.data.metrics[15] || '';
                    }
                    if(data.data.hayfever) {
                        document.getElementById('postcode_prefix').value = data.data.hayfever[1] || '';
                        document.getElementById('pollen_count_level').value = data.data.hayfever[2] || '';
                        
                        let symptoms = data.data.hayfever[3] || "";
                        document.querySelectorAll('.symptom-check').forEach(cb => { if(symptoms.includes(cb.value)) cb.checked = true; });
                        
                        document.getElementById('hayfever_duration_raw').value = data.data.hayfever[4] ? data.data.hayfever[4] + 'm' : '';
                        
                        let interventions = data.data.hayfever[5] || "";
                        document.querySelectorAll('.intervention-check').forEach(cb => {
                            if(interventions.includes(cb.value)) {
                                cb.checked = true;
                                let idSuffix = cb.id.split('_')[1];
                                
                                // Regex to pull Product and Score: e.g. "Eyedrops [Hycosan] (4/5)"
                                let match = interventions.match(new RegExp(cb.value + "\\s*(?:\\[(.*?)\\])?\\s*\\((\\d)"));
                                if(match) {
                                    if(match[1]) document.getElementById('prod_' + idSuffix).value = match[1];
                                    if(match[2]) {
                                        document.getElementById('rate_' + idSuffix).value = match[2];
                                        document.getElementById('rate_' + idSuffix).nextElementSibling.innerText = match[2];
                                    }
                                }
                            }
                        });
                    }
                    
                    // Populate Multiple General Symptoms
                    if(data.data.symptoms && data.data.symptoms.length > 0) {
                        data.data.symptoms.forEach(sym => {
                            // Backend Cols: Date(0) | Desc(1) | Cause(2) | Dur(3) | Timestamp(4) | Comment(5)
                            addSymptomRow(sym[1], sym[2], sym[3], sym[5]);
                        });
                    } else {
                        addSymptomRow(); // Add one blank row by default
                    }
                })
                .catch(err => fetchStatus.innerText = "Failed to load.");
        }

        window.addEventListener('DOMContentLoaded', () => {
            let today = new Date();
            document.getElementById('record_date').valueAsDate = today;

            fetch(GOOGLE_SCRIPT_URL)
                .then(res => res.json())
                .then(data => {
                    let availableSheets = data.availableSheets || [];
                    document.getElementById('loadingState').classList.add('hidden');
                    document.getElementById('healthspanForm').classList.remove('hidden');

                    if(!availableSheets.includes("Supplement_Tracking_Log")) document.getElementById('section_metrics').classList.add('hidden');
                    if(!availableSheets.includes("HayFever")) document.getElementById('section_hayfever').classList.add('hidden');
                    if(!availableSheets.includes("GeneralSymptoms")) document.getElementById('section_symptoms').classList.add('hidden');
                    
                    fetchDataForDate(document.getElementById('record_date').value);
                });
        });

        document.getElementById('healthspanForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const statusMsg = document.getElementById('statusMessage');
            btn.innerText = 'Syncing...'; btn.disabled = true; statusMsg.classList.add('hidden');

            let selectedSymptoms = [];
            document.querySelectorAll('.symptom-check:checked').forEach(cb => selectedSymptoms.push(cb.value));
            
            let selectedInterventions = [];
            document.querySelectorAll('.intervention-check:checked').forEach(cb => {
                let idSuffix = cb.id.split('_')[1];
                let rating = document.getElementById('rate_' + idSuffix).value;
                let prod = document.getElementById('prod_' + idSuffix).value;
                let prodStr = prod ? ` [${prod}]` : "";
                selectedInterventions.push(`${cb.value}${prodStr} (${rating}/5)`);
            });

            // Gather Dynamic Symptoms
            let generalSymptomsArray = [];
            document.querySelectorAll('.symptom-row').forEach(row => {
                let desc = row.querySelector('.sym-desc').value.trim();
                let cause = row.querySelector('.sym-cause').value.trim();
                if (desc || cause) {
                    generalSymptomsArray.push({
                        description: desc,
                        cause: cause,
                        duration: row.querySelector('.sym-dur').value,
                        comment: row.querySelector('.sym-comment').value
                    });
                }
            });

            const payload = {
                record_date: document.getElementById('record_date').value,
                ambient_temp_celsius: document.getElementById('ambient_temp_celsius').value,
                sleep_debt_manual: document.getElementById('sleep_debt_manual').value,
                
                hayfever_symptoms: selectedSymptoms.join(", "),
                hayfever_duration_mins: parseDuration(document.getElementById('hayfever_duration_raw').value),
                postcode_prefix: document.getElementById('postcode_prefix').value,
                pollen_count_level: document.getElementById('pollen_count_level').value,
                allergy_interventions_with_success: selectedInterventions.join(", "),
                
                general_symptoms_array: generalSymptomsArray
            };

            fetch(GOOGLE_SCRIPT_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(payload) })
            .then(res => res.json())
            .then(data => {
                if(data.status === "success") {
                    statusMsg.innerText = '✅ Saved to Ecosystem';
                    statusMsg.className = "text-center font-bold mt-4 text-emerald-800 bg-emerald-100 border border-emerald-400 p-3 rounded-lg block";
                } else throw new Error(data.message);
            })
            .catch((error) => {
                statusMsg.innerText = `❌ Failed: ${error.message}`;
                statusMsg.className = "text-center font-bold mt-4 text-rose-800 bg-rose-100 border border-rose-400 p-3 rounded-lg block";
            })
            .finally(() => { btn.innerText = 'UPDATE DATABASE FOR SELECTED DATE'; btn.disabled = false; });
        });
        
    </script>
    <!-- Register Service Worker -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then((reg) => console.log('Service Worker registered.', reg))
                    .catch((err) => console.error('Service Worker registration failed:', err));
            });
        }
    </script>
</body>
</html>
